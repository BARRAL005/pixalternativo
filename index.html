<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b0b" />
  <title>PIX Pit Stop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="brand">
        <div class="logo">PIT<br><span>STOP</span></div>
        <div>
          <p class="eyebrow">PAGAMENTO RÁPIDO</p>
          <h1>Gerador PIX</h1>
        </div>
      </div>

      <div class="pix-key">
        <span>Chave PIX fixa</span>
        <strong>64.712.625/0001-69</strong>
      </div>

      <label for="amount">Valor da cobrança</label>
      <div class="amount-box">
        <span>R$</span>
        <input id="amount" inputmode="decimal" autocomplete="off" placeholder="0,00" />
      </div>

      <div class="quick-values">
        <button data-value="10">R$ 10</button>
        <button data-value="20">R$ 20</button>
        <button data-value="50">R$ 50</button>
        <button data-value="100">R$ 100</button>
      </div>

      <section id="result" class="result hidden" aria-live="polite">
        <p class="result-label">ESCANEIE PARA PAGAR</p>
        <h2 id="displayAmount">R$ 0,00</h2>
        <div id="qrcode" class="qr"></div>
        <textarea id="pixCode" readonly aria-label="PIX copia e cola"></textarea>
        <div class="actions">
          <button id="copyBtn" class="primary">Copiar PIX</button>
          <button id="clearBtn" class="secondary">Novo pagamento</button>
        </div>
        <p id="copyStatus" class="status"></p>
      </section>

      <p class="foot">Digite o valor e o QR Code é atualizado automaticamente.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
